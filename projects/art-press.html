<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Art/Press | Nogime togo</title>
    <meta name="description" content="Nogime togoのArt/Pressアーカイブ。">
    <link rel="stylesheet" href="../styles.css?v=20260726-art-photograph">
  </head>
  <body class="project-page" data-return-url="../index.html?category=Art%2FPress#gallery">
    <header class="site-header">
      <div class="brand-block">
        <a class="brand" href="../index.html#top">Nogime togo</a>
        <p class="brand-tagline">Draw | Build | Place<br>Works in Architecture &amp; Photography</p>
      </div>
      <button class="menu-button" type="button" aria-expanded="false" aria-controls="primaryNav">MENU</button>
      <nav id="primaryNav" class="primary-nav" aria-label="Primary navigation">
        <a href="../index.html?category=Art%2FPress#gallery">WORKS</a>
        <a href="../index.html#profile">PROFILE</a>
        <a href="../index.html#news">NEWS</a>
        <a href="../contact.html">CONTACT</a>
      </nav>
    </header>

    <main class="project-main">
      <article class="project-hero">
        <div class="project-meta reveal">
          <p class="project-kicker"><span data-project-kicker>Art/Press</span> / <span data-project-year></span></p>
          <h1 class="project-title" data-project-title></h1>
          <div class="project-summary" data-project-summary></div>
        </div>

        <div class="project-images" data-project-images aria-label="Art and press images"></div>
      </article>
    </main>

    <div class="project-return">Click anywhere to return</div>
    <div class="image-lightbox" data-image-lightbox aria-hidden="true">
      <div class="image-lightbox__content" data-image-lightbox-content></div>
      <span class="image-lightbox__hint">Click to close</span>
    </div>

    <script src="../data/projects.js?v=20260808-art-photograph-14"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const slug = params.get("slug");
      const project = (window.nogimeProjects || []).find((item) => item.slug === slug) || window.nogimeProjects?.[0];

      function assetUrl(path) {
        if (!path) return "";
        if (/^(https?:|data:|\.\/|\.\.\/|\/)/.test(path)) return path;
        return `../${path}`;
      }

      if (project) {
        document.title = `${project.title} | Nogime togo`;
        document.querySelector("[data-project-kicker]").textContent = project.kicker || project.category;
        document.querySelector("[data-project-year]").textContent = project.year;
        document.querySelector("[data-project-title]").textContent = project.title;
        document.querySelector("[data-project-images]").setAttribute("aria-label", `${project.title} images`);
        const usesBookmat = project.presentation?.startsWith("bookmat");
        document.body.classList.toggle("art-gallery-page", usesBookmat);

        const lightbox = document.querySelector("[data-image-lightbox]");
        const lightboxContent = document.querySelector("[data-image-lightbox-content]");

        function closeLightbox() {
          lightbox.classList.remove("is-open");
          lightbox.setAttribute("aria-hidden", "true");
          lightboxContent.replaceChildren();
          document.body.classList.remove("has-image-lightbox");
        }

        function openLightbox(img) {
          const mat = img.closest(".bookmat");
          if (mat) {
            const enlargedMat = mat.cloneNode(true);
            enlargedMat.classList.add("image-lightbox__bookmat");
            const enlargedImage = enlargedMat.querySelector("img");
            enlargedImage.loading = "eager";
            lightboxContent.replaceChildren(enlargedMat);
          } else {
            const enlargedImage = img.cloneNode();
            enlargedImage.className = "image-lightbox__image";
            enlargedImage.loading = "eager";
            lightboxContent.replaceChildren(enlargedImage);
          }
          lightbox.classList.add("is-open");
          lightbox.setAttribute("aria-hidden", "false");
          document.body.classList.add("has-image-lightbox");
        }

        lightbox.addEventListener("click", (event) => {
          event.stopPropagation();
          closeLightbox();
        });

        const summary = document.querySelector("[data-project-summary]");
        project.summary.forEach((text) => {
          const paragraph = document.createElement("p");
          paragraph.textContent = text;
          summary.append(paragraph);
        });

        const images = document.querySelector("[data-project-images]");
        project.images.forEach((image, index) => {
          const figure = document.createElement("figure");
          figure.className = usesBookmat ? "reveal bookmat-work" : "reveal";
          const img = document.createElement("img");
          img.src = assetUrl(image);
          img.alt = project.imageCaptions?.[index] || `${project.title} image ${index + 1}`;
          img.loading = index < 2 ? "eager" : "lazy";
          img.decoding = "async";
          img.addEventListener("error", () => {
            figure.remove();
          }, { once: true });
          if (project.zoomable) {
            img.classList.add("is-zoomable");
            img.addEventListener("click", (event) => {
              event.stopPropagation();
              openLightbox(img);
            });
          }

          if (usesBookmat) {
            const mat = document.createElement("div");
            mat.className = "bookmat";
            const windowElement = document.createElement("div");
            windowElement.className = "bookmat__window";

            function sizeBookmat(width, height) {
              if (!width || !height || !project.presentation.includes("fit")) return;
              const ratio = width / height;
              const portraitMat = Boolean(project.portraitMats && height > width);
              mat.classList.toggle("is-portrait", portraitMat);

              const matWidth = portraitMat ? 254 : 305;
              const matHeight = portraitMat ? 305 : 254;
              const apertureMaxWidth = portraitMat ? 194 : 245;
              const apertureMaxHeight = portraitMat ? 245 : 194;
              const apertureWidth = Math.min(apertureMaxWidth, apertureMaxHeight * ratio);
              const apertureHeight = apertureWidth / ratio;

              windowElement.style.width = `${(apertureWidth / matWidth) * 100}%`;
              windowElement.style.height = `${(apertureHeight / matHeight) * 100}%`;
              windowElement.style.aspectRatio = `${width} / ${height}`;
            }

            const [width, height] = project.imageDimensions?.[index] || [];
            if (width && height) {
              sizeBookmat(width, height);
            } else {
              img.addEventListener("load", () => sizeBookmat(img.naturalWidth, img.naturalHeight), { once: true });
            }

            windowElement.append(img);
            mat.append(windowElement);
            figure.append(mat);
          } else {
            figure.append(img);
          }
          const captionText = project.imageCaptions?.[index];
          if (captionText) {
            const caption = document.createElement("figcaption");
            caption.textContent = captionText;
            figure.append(caption);
          }
          images.append(figure);
        });
      }

      const revealObserver = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("is-visible");
              revealObserver.unobserve(entry.target);
            }
          });
        },
        { rootMargin: "0px 0px -12% 0px", threshold: 0.12 }
      );

      document.documentElement.classList.add("reveal-ready");
      document.querySelectorAll(".reveal").forEach((item) => revealObserver.observe(item));

      const primaryNav = document.querySelector(".primary-nav");
      const menuButton = document.querySelector(".menu-button");

      menuButton.addEventListener("click", (event) => {
        event.stopPropagation();
        const open = !primaryNav.classList.contains("is-open");
        primaryNav.classList.toggle("is-open", open);
        menuButton.setAttribute("aria-expanded", String(open));
      });

      document.addEventListener("click", (event) => {
        if (document.body.classList.contains("has-image-lightbox")) return;
        if (event.target.closest("a")) return;
        if (event.target.closest("button")) return;
        window.location.href = document.body.dataset.returnUrl;
      });
    </script>
  </body>
</html>
