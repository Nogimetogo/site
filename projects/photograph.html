<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Photograph | Nogime togo</title>
    <meta name="description" content="Nogime togoのPhotograph作品を、製本された写真集のように閲覧できます。">
    <link rel="stylesheet" href="../styles.css?v=20260801-crown-line-margin">
  </head>
  <body class="photo-book-page" data-return-url="../index.html?category=Photograph#gallery">
    <header class="book-header">
      <a class="book-brand" href="../index.html?category=Photograph#gallery">Nogime togo</a>
      <p class="book-section">Photograph</p>
      <a class="book-close" href="../index.html?category=Photograph#gallery" aria-label="写真集を閉じる">close</a>
    </header>

    <main class="book-stage">
      <section class="photo-book is-closed" data-photo-book aria-label="写真集">
        <button class="book-cover" type="button" data-open-book aria-label="表紙を開く">
          <span class="cover-title" data-cover-title></span>
          <span class="cover-author">Nogime togo</span>
          <span class="cover-image">
            <img data-cover-image alt="">
          </span>
        </button>

        <div class="book-spread" data-book-spread aria-live="polite">
          <figure class="book-page book-page--left">
            <div class="page-photo">
              <img data-left-image alt="">
            </div>
          </figure>
          <figure class="book-page book-page--right">
            <div class="page-photo">
              <img data-right-image alt="">
            </div>
          </figure>
          <div
            class="book-spread__full"
            data-full-spread
          >
            <img
              data-full-spread-image
              alt=""
            >
          </div>
          <span class="book-gutter" aria-hidden="true"></span>
        </div>
      </section>

      <nav class="book-controls" aria-label="写真集ページ操作">
        <button type="button" data-previous-page aria-label="前の見開き">←</button>
        <p><span data-current-spread>表紙</span><span class="control-divider"> / </span><span data-total-spreads>0</span></p>
        <button type="button" data-next-page aria-label="次の見開き">→</button>
      </nav>
      <p class="book-hint" data-book-hint>表紙をクリックして開く</p>
    </main>

    <script src="../data/photograph-projects.js?v=20260719-photobook"></script>
    <script src="../data/photograph-projects-2-11.js?v=20260726-wall-distance"></script>
    <script src="../data/photograph-projects-7.js?v=20260726-lingering-canvas"></script>
    <script src="../data/photograph-project-merges.js?v=20260726-wall-distance-to-2-0"></script>
    <script src="../data/photograph-projects-6.js?v=20260720-two-line-cover-title"></script>
    <script src="../data/photograph-projects-9.js?v=20260801-clown-line-margin"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const slugAliases = {
        "urban-arrangement-change": "urban-arrangement",
        "roof-equilibrium": "roof-interface",
        "roof-trace": "roof-interface",
        "roof-irreversible": "roof-invisible-force",
        "nogime-no-background": "nogime-unnamed-arrangement",
        "nogime-no-focus-pattern": "nogime-unnamed-arrangement",
        "nogime-open-form": "nogime-whole-as-part"
      };
      const requestedSlug = params.get("slug");
      const slug = slugAliases[requestedSlug] || requestedSlug;
      const project = (window.photographProjects || []).find((item) => item.slug === slug)
        || window.photographProjects?.[0];
      const book = document.querySelector("[data-photo-book]");
      if (project?.contentMargin) {
        book.style.setProperty("--book-content-margin", project.contentMargin);
      }
      const openButton = document.querySelector("[data-open-book]");
      const previousButton = document.querySelector("[data-previous-page]");
      const nextButton = document.querySelector("[data-next-page]");
      const leftImage = document.querySelector("[data-left-image]");
      const rightImage = document.querySelector("[data-right-image]");
      const spreadElement = document.querySelector("[data-book-spread]");
      const fullSpreadImage = document.querySelector("[data-full-spread-image]");
      const hint = document.querySelector("[data-book-hint]");
      const currentSpread = document.querySelector("[data-current-spread]");
      const totalSpreads = document.querySelector("[data-total-spreads]");
      const coverFadeDuration = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 420;
      let spread = -1;
      const projectSpreads = project?.spreads?.length
        ? project.spreads
        : Array.from({ length: Math.ceil((project?.images?.length || 0) / 2) }, (_, index) => ({
            left: project.images[index * 2],
            right: project.images[index * 2 + 1]
          }));

      function getPhotographCoverTheme(item) {
        if (item.slug.startsWith("roof-")) return "beige";
        if (["urban-arrangement", "urban-arrangement-change", "urban-wall", "wall-distance"].includes(item.slug)) {
          return "blue-black";
        }
        if (item.slug.startsWith("nogime-")) return "graphic-charcoal";
        if (item.slug === "image-edge-form") return "dark-green";
        if (item.slug === "window-gaze-knot") return "charcoal-brown";
        if (item.slug === "lingering-undecided-ending") return "black-90";
        if (item.slug === "photograph-half-phrase") return "gray-pink";
        return "beige";
      }

      function assetUrl(path) {
        if (!path) return "";
        if (/^(https?:|data:|\.\/|\.\.\/|\/)/.test(path)) return path;
        return `../${path}`;
      }

      function setPageImage(element, image, index) {
        const page = element.closest(".book-page");
        if (!image) {
          element.removeAttribute("src");
          element.alt = "";
          page.classList.add("is-blank");
          return;
        }
        element.src = assetUrl(image);
        element.alt = `${project.title} 写真 ${index + 1}`;
        page.classList.remove("is-blank");
      }

      function renderSpread() {
        const spreadData = projectSpreads[spread];
        const leftIndex = spread * 2;
        const rightIndex = leftIndex + 1;
        const isFullSpread = Boolean(spreadData?.full);
        const isSingleSpread = Boolean(spreadData?.single);
        spreadElement.classList.toggle("is-full-spread", isFullSpread);
        spreadElement.classList.toggle("is-single-spread", isSingleSpread);
        spreadElement.classList.toggle("is-single-left", isSingleSpread && spreadData.align === "left");
        spreadElement.classList.toggle("is-single-right", isSingleSpread && spreadData.align === "right");
        if (isFullSpread || isSingleSpread) {
          fullSpreadImage.src = assetUrl(spreadData.full || spreadData.single);
          fullSpreadImage.alt = `${project.title} 見開き写真 ${spread + 1}`;
          setPageImage(leftImage, null, leftIndex);
          setPageImage(rightImage, null, rightIndex);
        } else {
          fullSpreadImage.removeAttribute("src");
          fullSpreadImage.alt = "";
          setPageImage(leftImage, spreadData?.left, leftIndex);
          setPageImage(rightImage, spreadData?.right, rightIndex);
        }
        currentSpread.textContent = String(spread + 1);
        previousButton.disabled = false;
        nextButton.disabled = spread >= projectSpreads.length - 1;
      }

      function openBook() {
        if (!book.classList.contains("is-closed") || book.classList.contains("is-cover-fading")) return;
        spread = 0;
        renderSpread();
        book.classList.add("is-cover-fading");
        openButton.setAttribute("aria-hidden", "true");
        openButton.tabIndex = -1;
        hint.textContent = "余白をクリック、または矢印キーでページをめくる";
        window.setTimeout(() => {
          book.classList.remove("is-closed", "is-cover-fading");
        }, coverFadeDuration);
      }

      function closeProject() {
        if (document.referrer && window.history.length > 1) {
          window.history.back();
          return;
        }
        window.location.href = document.body.dataset.returnUrl;
      }

      function turnTo(nextSpread) {
        if (nextSpread < 0) return;
        if (nextSpread >= projectSpreads.length) {
          closeProject();
          return;
        }
        spread = nextSpread;
        renderSpread();
      }

      function previous() {
        if (spread === 0) {
          spread = -1;
          book.classList.add("is-closed");
          openButton.removeAttribute("aria-hidden");
          openButton.tabIndex = 0;
          currentSpread.textContent = "表紙";
          previousButton.disabled = true;
          nextButton.disabled = false;
          hint.textContent = "表紙をクリックして開く";
          return;
        }
        turnTo(spread - 1);
      }

      if (project?.images?.length) {
        document.title = `${project.title} | Nogime togo`;
        book.classList.add(`cover-theme-${getPhotographCoverTheme(project)}`);
        book.classList.add(`project-${project.slug}`);
        book.setAttribute("aria-label", `${project.title} 写真集`);
        const coverTitle = document.querySelector("[data-cover-title]");
        const coverTitleLines = project.coverTitleLines || [project.title];
        coverTitle.replaceChildren(...coverTitleLines.map((line) => {
          const titleLine = document.createElement("span");
          titleLine.textContent = line;
          return titleLine;
        }));
        const coverImage = document.querySelector("[data-cover-image]");
        coverImage.src = assetUrl(project.cover || project.images[0]);
        coverImage.alt = `${project.title} 表紙`;
        totalSpreads.textContent = String(projectSpreads.length);
        nextButton.disabled = false;
      } else {
        document.querySelector("[data-cover-title]").textContent = "Photograph";
        previousButton.disabled = true;
        nextButton.disabled = true;
        openButton.disabled = true;
        hint.textContent = "作品を表示できません";
      }

      openButton.addEventListener("click", openBook);
      previousButton.addEventListener("click", previous);
      nextButton.addEventListener("click", () => {
        if (spread < 0) openBook();
        else turnTo(spread + 1);
      });
      document.querySelector("[data-book-spread]").addEventListener("click", (event) => {
        if (event.clientX < window.innerWidth / 2) previous();
        else turnTo(spread + 1);
      });
      window.addEventListener("keydown", (event) => {
        if (event.key === "ArrowLeft") previous();
        if (event.key === "ArrowRight" || event.key === "Enter" && spread < 0) {
          if (spread < 0) openBook();
          else turnTo(spread + 1);
        }
        if (event.key === "Escape") {
          closeProject();
        }
      });
      previousButton.disabled = true;
    </script>
  </body>
</html>
